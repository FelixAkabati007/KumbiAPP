name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (no warnings allowed)
        run: pnpm next lint --max-warnings=0

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Run unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Build
        run: pnpm run build

  db-migrate-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Neon migrations placeholder
        run: echo "Neon migrations managed outside CI"
